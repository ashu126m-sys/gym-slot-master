{% extends 'base.html' %}{% block title %}Admin Settings{% endblock %}{% block content %}<section class="page-head"><div class="eyebrow">ADMIN SETTINGS</div><h1>Account & Contact</h1></section><section class="section"><h2>Change admin login</h2><form class="form-card" method="POST"><input type="hidden" name="form_type" value="credentials"><label>New username<input name="username" value="{{ username }}" required></label><label>Current password<input type="password" name="current_password" required></label><label>New password (leave blank to keep current)<input type="password" name="new_password" minlength="8"></label><button class="btn primary">Update login details</button></form></section><section class="section"><h2>Home page contact details</h2><form class="form-card" method="POST"><input type="hidden" name="form_type" value="contact"><label>Phone number<input name="phone" value="{{ phone }}" placeholder="Gym contact number"></label><label>WhatsApp number<input name="whatsapp" value="{{ whatsapp }}" placeholder="Country code + number"></label><label>Email address<input type="email" name="email" value="{{ email }}" placeholder="gym@example.com"></label><button class="btn primary">Save contact details</button></form></section>{% endblock %}
